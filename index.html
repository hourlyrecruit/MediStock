<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafaf8" />
    <script>
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('medistock:ui') || '{}');
          var pref = (stored.state && stored.state.theme) || 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.motion =
            (stored.state && stored.state.motion) === 'off' ? 'off' : 'on';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.dataset.motion = 'on';
        }
      })();
    </script>
    <meta
      name="description"
      content="MediStock — medicine stock and expiry management for small pharmacies and clinics."
    />
    <title>MediStock</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
